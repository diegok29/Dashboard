<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Financeiro</title>
  <!-- Tailwind CSS CDN para estilização -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN para os gráficos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

  <div class="max-w-6xl mx-auto p-4 sm:p-6 space-y-6">
    <!-- Header -->
    <header class="flex flex-col sm:flex-row justify-between items-center gap-4 border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold text-white">Dashboard Financeiro</h1>
        <p class="text-slate-400 text-sm">Controle suas finanças de forma simples e visual</p>
      </div>
      <button onclick="toggleModal(true)" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2 rounded-lg transition-all shadow-lg shadow-indigo-600/20">
        + Nova Transação
      </button>
    </header>

    <!-- Cards de Resumo -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-slate-800 border border-slate-700/50 p-5 rounded-xl shadow-md">
        <span class="text-slate-400 text-sm font-medium">Entradas</span>
        <h2 id="totalIncomes" class="text-2xl font-bold text-emerald-400 mt-2">R$ 0,00</h2>
      </div>
      <div class="bg-slate-800 border border-slate-700/50 p-5 rounded-xl shadow-md">
        <span class="text-slate-400 text-sm font-medium">Saídas</span>
        <h2 id="totalOutcomes" class="text-2xl font-bold text-rose-400 mt-2">R$ 0,00</h2>
      </div>
      <div class="bg-slate-800 border border-slate-700/50 p-5 rounded-xl shadow-md">
        <span class="text-slate-400 text-sm font-medium">Saldo Total</span>
        <h2 id="totalBalance" class="text-2xl font-bold text-white mt-2">R$ 0,00</h2>
      </div>
    </div>

    <!-- Área de Gráfico e Filtros -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Gráfico de Despesas por Categoria -->
      <div class="bg-slate-800 border border-slate-700/50 p-5 rounded-xl shadow-md flex flex-col items-center">
        <h3 class="text-lg font-semibold mb-4 w-full text-left">Despesas por Categoria</h3>
        <div class="w-full max-w-[280px] aspect-square relative flex items-center justify-center">
          <canvas id="categoryChart"></canvas>
        </div>
      </div>

      <!-- Tabela e Filtros -->
      <div class="lg:col-span-2 bg-slate-800 border border-slate-700/50 p-5 rounded-xl shadow-md space-y-4">
        
        <div class="flex flex-col sm:flex-row justify-between items-center gap-3">
          <h3 class="text-lg font-semibold w-full sm:w-auto">Histórico de Transações</h3>
          
          <div class="flex gap-2 w-full sm:w-auto">
            <input type="text" id="searchInput" oninput="renderApp()" placeholder="Buscar por título..." 
              class="bg-slate-900 border border-slate-700 px-3 py-1.5 rounded-lg text-sm w-full sm:w-48 focus:outline-none focus:border-indigo-500 text-white" />
            
            <select id="categoryFilter" onchange="renderApp()" 
              class="bg-slate-900 border border-slate-700 px-3 py-1.5 rounded-lg text-sm focus:outline-none focus:border-indigo-500 text-white">
              <option value="all">Todas Categorias</option>
              <option value="Trabalho">Trabalho</option>
              <option value="Alimentação">Alimentação</option>
              <option value="Moradia">Moradia</option>
              <option value="Lazer">Lazer</option>
              <option value="Outros">Outros</option>
            </select>
          </div>
        </div>

        <div class="overflow-x-auto max-h-[320px] overflow-y-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-slate-900/60 text-slate-400 sticky top-0">
              <tr>
                <th class="p-3">Título</th>
                <th class="p-3">Valor</th>
                <th class="p-3">Categoria</th>
                <th class="p-3">Data</th>
                <th class="p-3 text-center">Ações</th>
              </tr>
            </thead>
            <tbody id="transactionsTableBody" class="divide-y divide-slate-700/50">
              <!-- Inserido dinamicamente via JS -->
            </tbody>
          </table>
        </div>

      </div>
    </div>
  </div>

  <!-- Modal para Adicionar Transação -->
  <div id="transactionModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-md p-6 rounded-xl shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b border-slate-700 pb-3">
        <h3 class="text-lg font-bold">Nova Transação</h3>
        <button onclick="toggleModal(false)" class="text-slate-400 hover:text-white">&times;</button>
      </div>

      <form id="transactionForm" onsubmit="handleCreateTransaction(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Título</label>
          <input type="text" id="formTitle" required placeholder="Ex: Supermercado" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-indigo-500 text-white" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Valor (R$)</label>
            <input type="number" id="formAmount" step="0.01" min="0.01" required placeholder="0.00" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-indigo-500 text-white" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Tipo</label>
            <select id="formType" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-indigo-500 text-white">
              <option value="income">Entrada (+)</option>
              <option value="outcome">Saída (-)</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Categoria</label>
            <select id="formCategory" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-indigo-500 text-white">
              <option value="Trabalho">Trabalho</option>
              <option value="Alimentação">Alimentação</option>
              <option value="Moradia">Moradia</option>
              <option value="Lazer">Lazer</option>
              <option value="Outros">Outros</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Data</label>
            <input type="date" id="formDate" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-indigo-500 text-white" />
          </div>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="toggleModal(false)" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-medium transition-all">Cancelar</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm font-medium transition-all">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript Principal -->
  <script>
    const STORAGE_KEY = 'dashboard_transactions_data';
    let transactions = [];
    let myChart = null;

    // Dados Iniciais (Mock) caso esteja vazio
    const initialMock = [
      { id: crypto.randomUUID(), title: 'Salário', amount: 5000, type: 'income', category: 'Trabalho', date: '2026-09-01' },
      { id: crypto.randomUUID(), title: 'Supermercado', amount: 650.50, type: 'outcome', category: 'Alimentação', date: '2026-09-05' },
      { id: crypto.randomUUID(), title: 'Aluguel', amount: 1500, type: 'outcome', category: 'Moradia', date: '2026-09-10' },
      { id: crypto.randomUUID(), title: 'Cinema', amount: 80, type: 'outcome', category: 'Lazer', date: '2026-09-12' },
    ];

    // Inicialização do sistema
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('formDate').valueAsDate = new Date();
      loadTransactions();
      renderApp();
    });

    // LocalStorage
    function loadTransactions() {
      const data = localStorage.getItem(STORAGE_KEY);
      transactions = data ? JSON.parse(data) : initialMock;
    }

    function saveTransactions() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
    }

    // Modal Control
    function toggleModal(show) {
      const modal = document.getElementById('transactionModal');
      modal.classList.toggle('hidden', !show);
    }

    // Formatador de Moeda
    function formatCurrency(amount) {
      return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(amount);
    }

    // Formatador de Data
    function formatDate(dateString) {
      const [year, month, day] = dateString.split('-');
      return `${day}/${month}/${year}`;
    }

    // Criar Nova Transação
    function handleCreateTransaction(event) {
      event.preventDefault();

      const newTransaction = {
        id: crypto.randomUUID(),
        title: document.getElementById('formTitle').value,
        amount: parseFloat(document.getElementById('formAmount').value),
        type: document.getElementById('formType').value,
        category: document.getElementById('formCategory').value,
        date: document.getElementById('formDate').value
      };

      transactions.unshift(newTransaction);
      saveTransactions();
      renderApp();

      document.getElementById('transactionForm').reset();
      document.getElementById('formDate').valueAsDate = new Date();
      toggleModal(false);
    }

    // Deletar Transação
    function deleteTransaction(id) {
      transactions = transactions.filter(t => t.id !== id);
      saveTransactions();
      renderApp();
    }

    // Renderizar Interface Principal
    function renderApp() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const categoryFilter = document.getElementById('categoryFilter').value;

      // Filtragem
      const filteredTransactions = transactions.filter(t => {
        const matchesSearch = t.title.toLowerCase().includes(search);
        const matchesCategory = categoryFilter === 'all' || t.category === categoryFilter;
        return matchesSearch && matchesCategory;
      });

      // Cálculos do Resumo
      const incomes = transactions.filter(t => t.type === 'income').reduce((acc, t) => acc + t.amount, 0);
      const outcomes = transactions.filter(t => t.type === 'outcome').reduce((acc, t) => acc + t.amount, 0);
      const balance = incomes - outcomes;

      document.getElementById('totalIncomes').textContent = formatCurrency(incomes);
      document.getElementById('totalOutcomes').textContent = formatCurrency(outcomes);
      document.getElementById('totalBalance').textContent = formatCurrency(balance);

      // Renderizar Tabela
      const tbody = document.getElementById('transactionsTableBody');
      tbody.innerHTML = '';

      if (filteredTransactions.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-500">Nenhuma transação encontrada.</td></tr>`;
      } else {
        filteredTransactions.forEach(t => {
          const isIncome = t.type === 'income';
          const row = document.createElement('tr');
          row.className = 'hover:bg-slate-700/30 transition-colors';
          row.innerHTML = `
            <td class="p-3 font-medium text-white">${t.title}</td>
            <td class="p-3 font-semibold ${isIncome ? 'text-emerald-400' : 'text-rose-400'}">
              ${isIncome ? '+' : '-'} ${formatCurrency(t.amount)}
            </td>
            <td class="p-3"><span class="bg-slate-700 text-slate-300 px-2.5 py-1 rounded-md text-xs">${t.category}</span></td>
            <td class="p-3 text-slate-400">${formatDate(t.date)}</td>
            <td class="p-3 text-center">
              <button onclick="deleteTransaction('${t.id}')" class="text-slate-400 hover:text-rose-400 transition-colors p-1" title="Excluir">
                &#128465;
              </button>
            </td>
          `;
          tbody.appendChild(row);
        });
      }

      renderChart();
    }

    // Renderizar Gráfico de Categorias (Chart.js)
    function renderChart() {
      const expensesByCategory = transactions
        .filter(t => t.type === 'outcome')
        .reduce((acc, t) => {
          acc[t.category] = (acc[t.category] || 0) + t.amount;
          return acc;
        }, {});

      const labels = Object.keys(expensesByCategory);
      const dataValues = Object.values(expensesByCategory);

      const ctx = document.getElementById('categoryChart').getContext('2d');

      if (myChart) {
        myChart.destroy();
      }

      if (dataValues.length === 0) {
        return;
      }

      myChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: dataValues,
            backgroundColor: ['#f43f5e', '#3b82f6', '#eab308', '#a855f7', '#64748b'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { color: '#94a3b8', font: { size: 11 } }
            }
          }
        }
      });
    }
  </script>
</body>
</html>
